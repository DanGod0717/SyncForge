# ---------- server ----------
server.port=8080

# ---------- datasource (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/syncforge?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- optional pool (minimal but useful) ----------
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

# ---------- logging ----------
logging.level.root=INFO
logging.level.com.example.syncforge=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.mybatis=INFO

# ---------- mybatis ----------
mybatis.mapper-locations=classpath:mapper/*xml
mybatis.type-aliases-package=com.example.syncforge

